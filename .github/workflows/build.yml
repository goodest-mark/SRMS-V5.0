name: Build SRMS Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ';'
            dist_path: dist/SRMS.exe
            artifact_name: SRMS-Windows
          - os: ubuntu-latest
            sep: ':'
            dist_path: dist/SRMS
            artifact_name: SRMS-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (with retry)
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_on: error
          command: |
            pip install --retries 5 --timeout 30 -r requirements.txt
            pip install --retries 5 --timeout 30 pyinstaller

      - name: Build executable
        shell: bash
        run: |
          # Use --windowed only on Windows (so Linux shows console errors if any)
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            WINDOWED="--windowed"
          else
            WINDOWED=""
          fi

          pyinstaller --onefile $WINDOWED --name "SRMS" \
            --paths . \
            --hidden-import=ui.pages.historical_results_page \
            --hidden-import=ui.pages.broadsheet_page \
            --hidden-import=ui.pages.remarks_page \
            --hidden-import=ui.pages.report_book_page \
            --hidden-import=combo_loaders \
            --hidden-import=class_utils \
            --hidden-import=db_utils \
            --hidden-import=event_bus \
            --hidden-import=system_state \
            --hidden-import=ranking \
            --collect-all ui \
            --collect-all PySide6 \
            --add-data "assets${{ matrix.sep }}assets" \
            --add-data "themes${{ matrix.sep }}themes" \
            --add-data "srms.db${{ matrix.sep }}." \
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}
