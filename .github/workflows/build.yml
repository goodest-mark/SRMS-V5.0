name: Build SRMS Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ';'
            dist_path: dist/SRMS.exe
            artifact_name: SRMS-Windows
          - os: ubuntu-latest
            sep: ':'
            dist_path: dist/SRMS
            artifact_name: SRMS-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name "SRMS" \
            --add-data "ui${{ matrix.sep }}ui" \
            --add-data "assets${{ matrix.sep }}assets" \
            --add-data "themes${{ matrix.sep }}themes" \
            --add-data "srms.db${{ matrix.sep }}." \
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}
