name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "SRMS" --add-data "ui;ui" --add-data "assets;assets" --add-data "themes;themes" --add-data "srms.db;." app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRMS-Windows
          path: dist/SRMS.exe
